name: Snake animation

# Renders the contribution graph as a snake game and pushes the SVGs to the
# `output` branch, which the README embeds. Nothing is committed to master.

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 GMT+8, daily
  workflow_dispatch:
  push:
    branches: ["master"]

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
